<!doctype html><meta charset="utf-8"><title>Other guest gameplay checks</title><style>body{font:16px system-ui;margin:24px}iframe{width:100%;height:850px}pre{white-space:pre-wrap}</style><h1>Other guest gameplay checks</h1><button id="run">Run quiz checks</button><pre id="results">Ready</pre><iframe id="game"></iframe><script type="module">
import {defaultControls} from '/src/services/parentalControlsService.js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Localhost only');
const wait=ms=>new Promise(r=>setTimeout(r,ms)), frame=document.querySelector('iframe'),out=document.querySelector('pre'),rows=[];
const doc=()=>frame.contentDocument,buttons=()=>[...doc().querySelectorAll('button')],btn=text=>buttons().find(b=>b.textContent.trim()===text),body=()=>doc().body.textContent;
async function until(fn,label){for(let i=0;i<600;i++){if(fn())return;await wait(100)}throw Error('Timeout '+label)}
function pass(ok,label){if(!ok)throw Error(label);rows.push('PASS '+label);out.textContent=rows.join('\n')}
async function click(el){if(!el)throw Error('Missing control');el.click();await wait(80)}
document.querySelector('#run').onclick=async()=>{try{
localStorage.removeItem('microbequest_usage:v1:guest');localStorage.setItem('microbequest_parental_controls',JSON.stringify({...defaultControls,screenTimeEnabled:false,allowedStartTime:'00:00',allowedEndTime:'23:59'}));localStorage.setItem('microbequest_onboarding_done','true');
frame.src='/quiz-challenge-system';await until(()=>btn('Start Quiz Adventure'),'quiz ready');await click(btn('Start Quiz Adventure'));
const answers=["b", "b", "c", "a", "b", "b", "a", "c"];
for(let i=0;i<answers.length;i++){
await until(()=>buttons().some(b=>b.textContent.trim().startsWith(answers[i].toUpperCase())&&!b.disabled),'answer '+i);
const answer=buttons().find(b=>b.textContent.trim().startsWith(answers[i].toUpperCase())&&b.querySelector('p'));
await click(answer);await until(()=>btn('Continue Learning'),'feedback');pass(body().includes('100%'),'question '+(i+1)+' accuracy');await click(btn('Continue Learning'));
}
await until(()=>body().includes('Quiz Complete'),'results');pass(body().includes('100%'),'perfect weighted quiz result');await wait(2500);pass(!body().includes('Excellent Work!'),'finished quiz does not reopen feedback');rows.push('DONE');out.textContent=rows.join('\n');
}catch(e){rows.push('FAIL '+e.message);out.textContent=rows.join('\n')}};
</script>
