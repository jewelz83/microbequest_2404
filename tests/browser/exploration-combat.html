<!doctype html><meta charset="utf-8"><title>Guest exploration and combat checks</title><style>body{font:16px system-ui;margin:24px}iframe{width:100%;height:850px}pre{white-space:pre-wrap}</style><h1>Guest exploration and combat checks</h1><button id="run">Run checks</button><pre id="results">Ready</pre><iframe></iframe><script type="module">
import {defaultControls} from '/src/services/parentalControlsService.js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Localhost only');
const wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.querySelector('iframe'),out=document.querySelector('pre'),rows=[];
const doc=()=>frame.contentDocument,buttons=()=>[...doc().querySelectorAll('button')],btn=t=>buttons().find(b=>b.textContent.trim()===t),body=()=>doc().body.textContent;
async function until(fn,label){for(let i=0;i<900;i++){if(fn())return;await wait(100)}throw Error('Timeout '+label)}
function pass(ok,label){if(!ok)throw Error(label);rows.push('PASS '+label);out.textContent=rows.join('\n')}
async function click(el){if(!el)throw Error('Missing control');el.click();await wait(100)}
async function open(route,ready){frame.src='/'+route;await until(()=>frame.contentWindow.location.pathname==='/'+route&&body().includes(ready),'open '+route);await wait(500)}
const stat=t=>[...doc().querySelectorAll('p')].find(p=>p.textContent===t)?.parentElement.textContent;
document.querySelector('#run').onclick=async()=>{try{
localStorage.removeItem('microbequest_usage:v1:guest');localStorage.setItem('microbequest_parental_controls',JSON.stringify({...defaultControls,screenTimeEnabled:false,allowedStartTime:'00:00',allowedEndTime:'23:59'}));
await open('microscope-discovery-lab','Specimen Library');
for(const name of ['E. coli Bacteria','Influenza Virus','E. coli Bacteria']){await click(buttons().find(b=>b.textContent.includes(name)));await wait(1100)}
pass(stat('Specimens Examined')?.includes('2'),'revisiting a specimen does not inflate examined count');
await open('world-explorer-mode','Choose Environment');
for(let environment=0;environment<3;environment++){
const cards=[...doc().querySelectorAll('h3')].filter(h=>['Soil Cross-Section','Water Droplet','Human Body System'].includes(h.textContent));
let card=cards[environment];while(card&&!card.querySelector('button'))card=card.parentElement;await click(card.querySelector('button'));
await until(()=>doc().querySelector('[aria-label^="Search "]'),'zones');
for(const zone of [...doc().querySelectorAll('[aria-label^="Search "]')]){zone.click();zone.click();await wait(1200)}
await until(()=>body().includes('Environment Complete!'),'environment completion');pass(body().includes(`${(environment+1)*3}/9`),'unique discoveries after habitat '+environment);
if(environment<2){await click(btn('Explore Another Environment'));for(let i=0;i<8;i++){const close=doc().querySelector('[aria-label="Close fun fact"]')||doc().querySelector('[aria-label="Close"]')||btn('Continue Exploring');if(close)await click(close);await wait(600)}}
}
rows.push('DONE');out.textContent=rows.join('\n');
}catch(e){rows.push('FAIL '+e.message);out.textContent=rows.join('\n')}};
</script>
